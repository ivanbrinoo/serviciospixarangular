
<table style="width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden;">
    <thead>
        <tr style="background-color: #0077b6; color: white; text-align: left;">
            <th style="border: 1px solid #d1d5db; padding: 12px 15px;">ID Personaje</th>
            <th style="border: 1px solid #d1d5db; padding: 12px 15px;">Nombre</th>
            <th style="border: 1px solid #d1d5db; padding: 12px 15px;">Imagen</th>
            <th style="border: 1px solid #d1d5db; padding: 12px 15px;">Película</th>
        </tr>
    </thead>
    <tbody>
        @for (personaje of arraypersonajespixar; track personaje; let par = $even) {
            <tr [style.background-color]="par ? '#f8fafc' : '#ffffff'">
                <td style="border: 1px solid #d1d5db; padding: 10px 15px; font-weight: bold; color: #555;">{{personaje.idPersonaje}}</td>
                <td style="border: 1px solid #d1d5db; padding: 10px 15px; color: #222;">{{personaje.nombre}}</td>
                <td style="border: 1px solid #d1d5db; padding: 10px 15px;">
                    <img [src]="personaje.imagen" [alt]="personaje.nombre" style="width: 60px; height: 60px; object-fit: cover; border-radius: 8px; display: block;">
                </td>
                <td style="border: 1px solid #d1d5db; padding: 10px 15px; color: #444;">{{personaje.pelicula}}</td>
            </tr>
        }
    </tbody>
</table>
