<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-danger text-white text-center py-3">
          <h4 class="mb-0">Eliminar Personaje</h4>
        </div>
        
        <div class="card-body p-4">
          <form #formulario="ngForm">
            <div class="mb-3">
              <label for="cajaid" class="form-label fw-semibold">
                ID del Personaje a eliminar
              </label>
              <input 
                type="number" 
                id="cajaid"
                name="cajaid" 
                #cajaid 
                class="form-control form-control-lg" 
                placeholder="Ej. 101" 
                required 
              />
            </div>
            
            <div class="d-grid mt-4">
              <button 
                type="button" 
                (click)="eliminarPersonajes()" 
                class="btn btn-danger btn-lg">
                Eliminar
              </button>
            </div>
          </form>

          <!-- Mensaje dinámico (solo se muestra si hay texto) -->
          <div *ngIf="mensaje" class="alert alert-danger mt-4 mb-0 text-center fw-bold" role="alert">
            {{ mensaje }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
